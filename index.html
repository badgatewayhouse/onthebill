<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>On the Bill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --charcoal:#131316;
  --paper:#F4F1EA;
  --paper-dim:rgba(244,241,234,.62);
  --paper-faint:rgba(244,241,234,.38);
  --coral:#EF6A5A;
  --hairline:rgba(244,241,234,.22);
  --display:'Anton','Haettenschweiler','Arial Narrow',Impact,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular','Courier New',monospace;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

html,body{
  height:100%;
  background:var(--charcoal);
  color:var(--paper);
  font-family:var(--mono);
}

body{
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

header{
  border-bottom:1px solid var(--hairline);
  padding:24px 32px;
}

.wordmark{
  font-family:var(--display);
  font-size:1.125rem;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--paper);
}

main{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:64px 32px;
  max-width:800px;
}

.headline{
  font-family:var(--display);
  font-size:clamp(3.5rem,13vw,7.5rem);
  line-height:0.9;
  letter-spacing:-0.01em;
  text-transform:uppercase;
  color:var(--paper);
  margin-bottom:40px;
}

.tagline{
  font-size:0.8125rem;
  color:var(--paper-dim);
  line-height:1.65;
  max-width:460px;
  margin-bottom:64px;
}

.nav-list{
  list-style:none;
  border-top:1px solid var(--hairline);
}

.nav-item{
  border-bottom:1px solid var(--hairline);
}

.nav-link{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px 0;
  text-decoration:none;
  color:var(--paper);
  font-size:0.6875rem;
  font-weight:600;
  letter-spacing:0.13em;
  text-transform:uppercase;
  transition:color 0.12s;
}

.nav-link:hover{ color:var(--coral); }

.nav-link[aria-disabled="true"]{
  color:var(--paper-faint);
  pointer-events:none;
}

.nav-label{ display:flex; align-items:center; gap:14px; }

.tag{
  font-size:0.5625rem;
  letter-spacing:0.1em;
  padding:2px 7px;
  border-radius:2px;
}

.tag--live{
  color:var(--coral);
  background:rgba(239,106,90,.14);
}

.tag--soon{
  color:var(--paper-faint);
  background:rgba(244,241,234,.07);
}

footer{
  border-top:1px solid var(--hairline);
  padding:24px 32px;
  font-size:0.5625rem;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--paper-faint);
}
</style>
</head>
<body>

<header>
  <span class="wordmark">On the Bill</span>
</header>

<main>
  <h1 class="headline">The<br>local<br>show.</h1>
  <p class="tagline">Artist cards, local gigs, zero algorithm. A system for surfacing live music the way it actually lives — on posters, in bars, passed between friends.</p>
  <nav aria-label="Sections">
    <ul class="nav-list">
      <li class="nav-item">
        <a href="design-lab.html" class="nav-link">
          <span class="nav-label">Design Lab <span class="tag tag--live">Live</span></span>
          <span>→</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link" aria-disabled="true">
          <span class="nav-label">Bands <span class="tag tag--soon">Soon</span></span>
          <span>→</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link" aria-disabled="true">
          <span class="nav-label">Shows <span class="tag tag--soon">Soon</span></span>
          <span>→</span>
        </a>
      </li>
    </ul>
  </nav>
</main>

<footer>On the Bill — In progress</footer>

</body>
</html>
